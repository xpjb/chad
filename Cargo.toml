[package]
name = "chad"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Thin platform layer for games: owns the winit event loop, window, wgpu init, surface lifecycle, and frame timing; exposes winit and wgpu raw."
license = "MIT OR Apache-2.0"
repository = "https://github.com/xpjb/chad"
readme = "README.md"
keywords = ["gamedev", "wgpu", "winit", "graphics", "windowing"]
categories = ["game-development", "graphics", "rendering"]
exclude = ["/.github", "/gallery", "/scripts"]

[dependencies]
# Re-exported as chad::winit / chad::wgpu; their majors are chad's public API.
wgpu = "30"
log = "0.4"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
env_logger = "0.11"

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = "0.30"

[target.'cfg(target_os = "android")'.dependencies]
winit_android_support = { package = "winit-android", git = "https://github.com/xpjb/winit-android-support.git", rev = "c90cd60290ddafa2e305ae4d4af9d301232c9758", default-features = false, features = ["java-activity"] }
winit_core_android_support = { package = "winit-core", git = "https://github.com/xpjb/winit-android-support.git", rev = "c90cd60290ddafa2e305ae4d4af9d301232c9758" }
dpi_android_support = { package = "dpi", git = "https://github.com/xpjb/winit-android-support.git", rev = "c90cd60290ddafa2e305ae4d4af9d301232c9758" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Event", "HtmlElement", "HtmlCanvasElement", "Node", "CssStyleDeclaration"] }

[dev-dependencies]
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
png = "0.18"
